name: Synchroniser les statuts immobiliers
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Capture JSON transmise par Apps Script
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: property-statuses
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Valider les statuts transmis par Apps Script
        run: node scripts/sync-google-sheets.mjs
      - name: Vérifier la génération avant publication
        run: |
          node --test scripts/property-statuses.test.mjs
          npm run generate
          npm run biens:check
          npm run build
      - name: Enregistrer les statuts et les pages générées
        run: |
          git add data/property-statuses.json data/property-status-sync.json biens/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Mettre à jour les statuts immobiliers depuis Google Sheets'
          git push
